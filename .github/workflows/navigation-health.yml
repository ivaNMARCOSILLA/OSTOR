name: Ol · accesos y funciones
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: read
concurrency:
  group: navigation-health-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  public-health:
    name: Páginas públicas · sin operaciones de clientes
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Revisar rutas, recursos y formulario público
        run: python tools/check_navigation.py --base-url https://electronicama.com --output navigation-health.json
      - name: Conservar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-health
          path: navigation-health.json
          retention-days: 14
  isolated-functions:
    name: Botones y autenticación · base de pruebas aislada
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OL_PAYMENT_PROVIDER: stripe
      OL_LIVE_PREMIERE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: sudo ln -sf "$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux*/chrome' -type f | head -1)" /usr/bin/chromium
      - name: Pruebas de servidor
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Navegación, registro, sesión, cámara y administración
        run: python tests/run_browsers.py test_home_menu_browser.py test_home_layout_browser.py test_wordmark_browser.py test_public_music_entry_browser.py test_community_roles_browser.py test_full_service_browser.py test_stream_continuity_browser.py test_subscriptions_browser.py test_holograms_browser.py test_live_navigation_browser.py test_registration_browser.py test_email_browser.py test_youtube_browser.py test_background_browser.py test_audio_browser.py test_membership_browser.py test_invitation_cleanup_browser.py test_two_factor_browser.py test_streamers_browser.py test_operations_browser.py test_shortcuts_browser.py
      - name: Estado de próximo estreno
        env:
          OL_LIVE_PREMIERE: '1'
        run: python tests/run_browsers.py test_premiere_browser.py test_shortcuts_browser.py
  postgres-security:
    name: Cuentas y correo · PostgreSQL aislado
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: maggy_test
          POSTGRES_PASSWORD: ol_local_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d maggy_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ol_local_ci_only@127.0.0.1:5432/maggy_test
      MAGGY_TEST_POSTGRES_URL: postgresql://postgres:ol_local_ci_only@127.0.0.1:5432/maggy_test
      MAGGY_COOKIE_SECURE: '0'
      OL_LIVE_PREMIERE: '0'
      OL_PAYMENT_PROVIDER: legacy_paypal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_postgres_integration.py' -v
