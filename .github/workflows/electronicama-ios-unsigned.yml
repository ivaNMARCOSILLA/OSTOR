name: ELECTRONICAMA iOS unsigned

on:
  push:
    branches:
      - desarrollo/electronicama-ios-build
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 90

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Patch ExpoModulesJSI Swift annotations (experimental)
        run: |
          python3 - <<'PY'
          from pathlib import Path

          header = Path("node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h")
          source = header.read_text()
          annotation = "SWIFT_RETURNS_RETAINED RuntimeScheduler("
          count = source.count(annotation)

          if count != 2:
              raise SystemExit(f"Expected 2 RuntimeScheduler annotations; found {count}")

          header.write_text(source.replace(annotation, "RuntimeScheduler("))
          print("Removed exactly 2 incompatible RuntimeScheduler annotations")
          swift_file = Path("node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI/Runtime/JavaScriptRuntime.swift")
          swift_source = swift_file.read_text()

          pointer_names = ("thisPtr", "argumentsPtr", "resultPtr")
          expected_counts = {"thisPtr": 2, "argumentsPtr": 2, "resultPtr": 3}

          for name in pointer_names:
              original = f"nonisolated(unsafe) let {name} = {name}"
              actual = swift_source.count(original)
              expected = expected_counts[name]
              if actual != expected:
                  raise SystemExit(f"Expected {expected} declarations of {name}; found {actual}")

          for name in pointer_names:
              original = f"nonisolated(unsafe) let {name} = {name}"
              replacement = f"let {name} = NonisolatedUnsafeVar({name})"
              swift_source = swift_source.replace(original, replacement)

          for name in pointer_names:
              swift_source = swift_source.replace(
                  f"to: {name})",
                  f"to: {name}.value)"
              )

          swift_source = swift_source.replace(
              "UnsafeMutablePointer(mutating: thisPtr).move()",
              "UnsafeMutablePointer(mutating: thisPtr.value).move()"
          )
          swift_source = swift_source.replace(
              "start: argumentsPtr, count: argumentsCount",
              "start: argumentsPtr.value, count: argumentsCount"
          )
          swift_source = swift_source.replace(
              "JavaScriptUnownedValue(runtime.pointee, thisPtr)",
              "JavaScriptUnownedValue(runtime.pointee, thisPtr.value)"
          )

          swift_file.write_text(swift_source)
          print("Patched exactly 7 Swift pointer declarations")
          PY
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/electronicama-build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package experimental IPA
        run: |
          set -e
          APP=$(find "$RUNNER_TEMP/electronicama-build/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/ELECTRONICAMA-iOS-unsigned.ipa" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ELECTRONICAMA-iOS-unsigned
          path: ${{ github.workspace }}/ELECTRONICAMA-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 7